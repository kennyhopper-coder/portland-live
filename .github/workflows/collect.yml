name: Update concert calendar
on:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect.py', '.github/workflows/collect.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: calendar-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      partial: ${{ steps.refresh.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml python-dateutil
      - id: refresh
        continue-on-error: true
        run: python collect.py
      - name: Commit changed listings
        run: |
          git add shows.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Portland concert listings'
            git push origin HEAD:main
          fi
  publish:
    needs: collect
    uses: ./.github/workflows/static.yml
  report:
    needs: [collect, publish]
    if: needs.collect.outputs.partial == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
